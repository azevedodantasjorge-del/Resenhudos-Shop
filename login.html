
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - Resenhudos Shop </title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="login.css">
</head>

<body>

    <header class="topo">
        <h2>Resenhudos Shop</h2>
        <p>Sua loja de informática e resenha</p>
    </header>

    <div class="container">

        <div class="login">

            <h2>Entrar na conta</h2>

            <form>

                <div class="mb-3">
                    <label class="form-label">E-mail:</label>
                    <input type="email" class="form-control"
                    placeholder="Digite seu e-mail">
                </div>

                <div class="mb-3">
                    <label class="form-label">Senha:</label>
                    <input type="password" class="form-control"
                    placeholder="Digite sua senha">
                </div>
               
                <button type="button" class="btn btn-warning" onclick="window.location.href='index.html'">
                    Entrar
                </button>
                
               
            </form>

            <hr>

            <p class="text-center mt-3">
                <a href="index.html" class="text-dark">
                    Voltar para a loja
                </a>
            </p>

        </div>

    </div>

    <footer class="rodape">
        <p>Resenhudos Shop - Sua loja de informática e resenha</p>
        <p>O maior site de informática e resenha de 2026</p>
    </footer>

</body>
</html>
